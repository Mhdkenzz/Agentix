name: CI
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Server + CLI tests
        run: npm test
      - name: Typecheck (server, CLI, dashboard)
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Dashboard build
        run: npm run build
      - name: Committed dashboard build is up to date
        run: git diff --exit-code --stat packages/web/dist || (echo "Run 'npm run build' and commit packages/web/dist" && exit 1)
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
